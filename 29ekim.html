<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#310812">
<title>29 Ekim Cumhuriyet Bayramı – Temaş Gıda</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--w:min(90vw,640px);--tx:49.56%;--ty:48.29%;--poly:polygon(0 0,100% 0,var(--tx) var(--ty));--lining:repeating-linear-gradient(135deg,#8c1c28 0 7px,#6d111d 7px 14px);--gold:#e5c77f;--gold-light:#f7e5b2;--ink:#fff8ea;--panel:#2b0711e8;--ease-out:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{min-height:100vh;min-height:100dvh;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--ink);font-family:Georgia,"Times New Roman",serif;background:radial-gradient(circle at 50% 42%,rgba(144,34,52,.34),transparent 43%),radial-gradient(ellipse at 50% 45%,#5a1220 0,#2a0710 82%)}
body::before{content:"";position:fixed;inset:-20%;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(255,219,150,.08),transparent 52%);animation:ambient 9s ease-in-out infinite alternate}
/* Loş Türk bayrağı: yalnızca arka plan katmanı. */
.flag-backdrop{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;isolation:isolate}
.flag-backdrop::before{content:"";position:absolute;inset:-3%;background:#e30a17 url("gizlidir.svg") center center/cover no-repeat;opacity:.18;transform:translate3d(0,0,0) scale(1.055);transform-origin:center;animation:flag-drift 22s ease-in-out infinite alternate}
.flag-backdrop::after{content:"";position:absolute;inset:-3%;background:linear-gradient(105deg,transparent 14%,rgba(20,0,7,.20) 29%,rgba(255,245,225,.12) 42%,transparent 56%,rgba(17,0,5,.18) 70%,transparent 84%);background-size:165% 100%;opacity:.35;animation:flag-light 25s ease-in-out infinite alternate}
@keyframes flag-drift{from{transform:translate3d(-.7%,.2%,0) scale(1.055) skewX(-.25deg)}to{transform:translate3d(.7%,-.2%,0) scale(1.055) skewX(.25deg)}}
@keyframes flag-light{from{background-position:0% center}to{background-position:100% center}}
@media (orientation:portrait){.flag-backdrop::before{background-position:38% center}}
@media (prefers-reduced-motion:reduce){.flag-backdrop::before,.flag-backdrop::after{animation:none}}
.stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:36px}
.env{position:relative;width:var(--w);aspect-ratio:16/9;perspective:1600px;cursor:pointer;isolation:isolate;-webkit-tap-highlight-color:transparent}
.env:focus-visible{outline:3px solid var(--gold);outline-offset:12px;border-radius:8px}
.env.done{cursor:default}
.env>*{position:absolute}
.back{inset:0;z-index:1;overflow:hidden;border-radius:6px;background:var(--lining);box-shadow:0 26px 48px rgba(0,0,0,.52),0 0 0 1px rgba(255,228,176,.08)}
.back::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08),transparent 24%,rgba(28,0,6,.18))}
.front{inset:0;z-index:3;border-radius:6px;background:url(zarf_dis.png) 0 0/100% 100%;clip-path:polygon(0 0,var(--tx) var(--ty),100% 0,100% 100%,0 100%);filter:drop-shadow(0 -2px 2px rgba(20,0,5,.2))}
.crease{inset:0;z-index:3;opacity:1;filter:blur(2.5px);transition:opacity 650ms ease;pointer-events:none}
.crease i{position:absolute;inset:0;background:rgba(35,0,6,.4);clip-path:polygon(0 1%,var(--tx) calc(var(--ty) + 1.5%),100% 1%,100% 6%,var(--tx) calc(var(--ty) + 7%),0 6%)}
.flap{inset:0;z-index:4;transform:rotateX(0deg) translateZ(.1px);transform-style:preserve-3d;transform-origin:50% 0;transition:transform 1250ms var(--ease-out),filter 1250ms ease;will-change:transform}
.flap b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;clip-path:var(--poly)}
.flap .o{background:url(zarf_dis.png) 0 0/100% 100%}
.flap .i{background:var(--lining);transform:rotateX(180deg)}
.card{z-index:2;left:4%;bottom:4%;width:92%;aspect-ratio:16/9;perspective:1600px;transform:translate3d(0,0,0);transform-origin:center;transition:transform 1600ms var(--ease-out),filter 1000ms ease;will-change:transform}
.flip{position:absolute;inset:0;transform:rotateY(0deg);transform-style:preserve-3d;transition:transform 950ms var(--ease-out);touch-action:pan-y;cursor:default;will-change:transform}
.flip.drag{transition:none}
.done .flip{cursor:grab}
.done .flip:active{cursor:grabbing}
.face{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;image-rendering:auto;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:5px;box-shadow:0 14px 38px rgba(0,0,0,.46),0 0 0 1px rgba(255,255,255,.12);user-select:none;-webkit-user-drag:none;pointer-events:none}
.bk{transform:rotateY(180deg)}
.env.open .flap{transform:rotateX(180deg) translateZ(.1px);filter:brightness(.92)}
.env.open .crease{opacity:0}
.env.low .flap{z-index:1}
.env.rise .card{transform:translate3d(0,-62%,0) scale(1.012);filter:drop-shadow(0 24px 24px rgba(0,0,0,.26))}
.env.out .card{z-index:8}
.env.out .back,.env.out .front,.env.out .flap{opacity:0;filter:blur(1px);transition:opacity 1000ms ease,filter 1000ms ease}
.hint{min-height:24px;font-size:18px;letter-spacing:.035em;text-shadow:0 2px 12px rgba(0,0,0,.45);animation:pulse 2.4s ease-in-out infinite;transition:opacity 450ms ease,transform 450ms ease}
.hint.hide{opacity:0;transform:translateY(7px);animation:none}
.hint.err{max-width:360px;text-align:center;line-height:1.5;animation:none}
@keyframes pulse{50%{opacity:.5;transform:translateY(-1px)}}
@keyframes ambient{to{transform:scale(1.06);opacity:.72}}
.panel{position:fixed;right:0;bottom:max(16px,env(safe-area-inset-bottom));left:0;z-index:20;display:flex;justify-content:center;padding:0 16px;opacity:0;transform:translate3d(0,18px,0);visibility:hidden;pointer-events:none;transition:opacity 700ms ease,transform 800ms var(--ease-out),visibility 0s linear 800ms}
.panel.show{opacity:1;transform:translate3d(0,0,0);visibility:visible;pointer-events:auto;transition-delay:0s}
.panel-inner{width:min(100%,940px);display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"message action" "tip action";column-gap:24px;row-gap:7px;align-items:center;padding:17px 18px 17px 22px;border:1px solid rgba(238,207,137,.28);border-radius:22px;background:linear-gradient(145deg,rgba(72,13,27,.96),var(--panel));box-shadow:0 18px 44px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.07);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.message{grid-area:message;position:relative;min-width:0;padding-left:18px}
.message::before{content:"";position:absolute;top:2px;bottom:2px;left:0;width:3px;border-radius:99px;background:linear-gradient(var(--gold-light),#a8752f);box-shadow:0 0 16px rgba(229,199,127,.28)}
.message-text{margin:0;overflow-wrap:anywhere;color:#fff8ea;font-family:"Lora",Georgia,serif;font-size:clamp(14px,1.55vw,18px);font-style:normal;font-weight:500;line-height:1.52;letter-spacing:.01em;text-wrap:pretty}
.message-text span{display:block}
.message-text span+span{margin-top:4px}
.message-text strong{color:var(--gold-light);font-weight:700}
.tip{grid-area:tip;margin:0;padding-left:18px;color:rgba(255,248,234,.68);font-size:12px;line-height:1.35}
.download-button{grid-area:action;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:190px;min-height:50px;padding:12px 20px;border:1px solid rgba(255,255,255,.3);border-radius:14px;appearance:none;cursor:pointer;color:#3a0814;background:linear-gradient(135deg,var(--gold-light),var(--gold) 60%,#c99f4f);box-shadow:0 9px 22px rgba(0,0,0,.26),inset 0 1px rgba(255,255,255,.7);font:700 15px/1 Georgia,"Times New Roman",serif;text-decoration:none;transition:transform 220ms ease,box-shadow 220ms ease,filter 220ms ease}
.download-button:hover{transform:translateY(-2px);filter:brightness(1.045);box-shadow:0 13px 27px rgba(0,0,0,.32),inset 0 1px rgba(255,255,255,.8)}
.download-button:active{transform:translateY(0)}
.download-button:disabled{cursor:wait;filter:saturate(.7);opacity:.82;transform:none}
.download-button svg{width:20px;height:20px;flex:none;stroke:currentColor}
.download-button:focus-visible,.card:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
@media (max-width:620px){.panel-inner{grid-template-columns:1fr;grid-template-areas:"message" "action" "tip";gap:14px;padding:18px 16px 17px;border-radius:18px}.message{padding-left:20px}.message-text{font-size:clamp(15px,4.15vw,17px);line-height:1.55;letter-spacing:.012em}.message-text span+span{margin-top:6px}.download-button{width:100%}.tip{text-align:center;padding-left:0;line-height:1.45}}
@media (max-width:350px) and (max-height:620px) and (orientation:portrait){.panel{padding:0 8px}.panel-inner{gap:10px;padding:14px 12px 13px}.message{padding-left:16px}.message-text span+span{margin-top:5px}.download-button{min-height:48px}.tip{font-size:11px}}
@media (max-height:620px) and (orientation:landscape){:root{--w:min(69vw,540px)}.panel{right:12px;bottom:12px;left:auto;width:min(38vw,360px);padding:0}.panel-inner{grid-template-columns:1fr;grid-template-areas:"message" "action" "tip";gap:9px;padding:12px}.message-text{font-size:13px}.download-button{width:100%;min-height:42px}.hint{font-size:15px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="flag-backdrop" aria-hidden="true"></div>
<main class="stage">
  <div class="env" id="env" role="button" tabindex="0" aria-label="Zarfı aç">
    <div class="back"></div>
    <div class="card" id="card">
      <div class="flip" id="flip">
        <img class="face fr" id="fr" alt="Kartpostalın ön yüzü">
        <img class="face bk" id="bk" alt="Kartpostalın arka yüzü">
      </div>
    </div>
    <div class="front"></div>
    <div class="crease"><i></i></div>
    <div class="flap"><b class="o"></b><b class="i"></b></div>
  </div>
  <div class="hint" id="hint" aria-live="polite">Yükleniyor…</div>
</main>
<aside class="panel" id="panel" aria-label="Kutlama mesajı ve indirme seçenekleri">
  <div class="panel-inner">
    <div class="message">
      <p class="message-text">
        <span>Temaş Gıda ailesi olarak, 29 Ekim Cumhuriyet Bayramını birlikte kutlamanın mutluluğunu yaşıyoruz.</span>
        <span>Cumhuriyetimizin ışığında, birlik ve beraberlik içinde nice güzel yarınlara</span>
        <span><strong>Cumhuriyetimizin 103. yılı kutlu olsun.</strong></span>
      </p>
    </div>
    <p class="tip" id="downloadNote" aria-live="polite">Kartı çevirmek için dokunun veya sürükleyin.</p>
    <button class="download-button" id="downloadButton" type="button" aria-label="Ön ve arka yüz görsellerini indir">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path>
        <path d="M5 21h14a2 2 0 0 0 2-2v-3"></path><path d="M3 16v3a2 2 0 0 0 2 2"></path>
      </svg>
      <span id="downloadLabel">DOWNLOAD</span>
    </button>
  </div>
</aside>

<script>
(function(){
  'use strict';
  var query=new URLSearchParams(location.search);
  var frontSource=query.get('on')||'gizlidir_on.png', backSource=query.get('arka')||'gizlidir_arka.png';
  var env=document.getElementById('env'), card=document.getElementById('card'),
      flip=document.getElementById('flip'), hint=document.getElementById('hint'),
      panel=document.getElementById('panel');
  var fr=document.getElementById('fr'), bk=document.getElementById('bk');
  var downloadButton=document.getElementById('downloadButton');
  var downloadLabel=document.getElementById('downloadLabel');
  var downloadNote=document.getElementById('downloadNote');
  var reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var rot=0,base=0,sx=0,drag=false,moved=false,started=false,done=false,need=3;

  function triggerDownload(source,fileName){
    var link=document.createElement('a');
    link.href=source;link.download=fileName;link.hidden=true;
    document.body.appendChild(link);link.click();link.remove();
  }
  function downloadBoth(){
    if(downloadButton.disabled) return;
    downloadButton.disabled=true;
    downloadLabel.textContent='İndirmeler Başlatılıyor…';
    downloadNote.textContent='Ön ve arka yüz iki ayrı dosya olarak hazırlanıyor.';
    triggerDownload(frontSource,'gizlidir_on.png');
    triggerDownload(backSource,'gizlidir_arka.png');
    setTimeout(function(){
      downloadButton.disabled=false;
      downloadLabel.textContent='Görselleri İndir';
      downloadNote.textContent='İki ayrı indirme başlatıldı. Tarayıcınız sorarsa çoklu indirmeye izin verin.';
    },900);
  }
  function ok(){if(--need===0){hint.textContent='Zarfa dokunun';env.setAttribute('aria-label','Zarfı aç');}}
  function bad(){
    hint.className='hint err';
    hint.textContent='Görseller yüklenemedi. Dosyaların sayfayla aynı klasörde olduğundan emin olun.';
    env.removeAttribute('role');env.removeAttribute('tabindex');
  }
  fr.onload=bk.onload=ok;fr.onerror=bk.onerror=bad;
  var pre=new Image();pre.onload=ok;pre.onerror=bad;pre.src='zarf_dis.png';
  fr.src=frontSource;bk.src=backSource;
  downloadButton.addEventListener('click',downloadBoth);

  function place(){
    var r=env.getBoundingClientRect(), panelRect=panel.getBoundingClientRect();
    var cw=r.width*.92, ch=cw*9/16;
    var cx=r.left+r.width*.04+cw/2, cy=r.bottom-r.height*.04-ch/2;
    var margin=innerWidth<500?14:24;
    var availableHeight=Math.max(180,innerHeight-(panelRect.height||0)-margin*3);
    var targetY=margin+availableHeight/2;
    var scale=Math.min((innerWidth-margin*2)/cw,availableHeight/ch,2.5);
    card.style.transform='translate3d('+(innerWidth/2-cx)+'px,'+(targetY-cy)+'px,0) scale('+scale+')';
  }
  function open(){
    if(started||need!==0) return;started=true;
    hint.classList.add('hide');
    env.classList.add('open');
    var timing=reducedMotion?{low:20,rise:40,out:70,done:110}:{low:650,rise:960,out:2250,done:3850};
    setTimeout(function(){env.classList.add('low');},timing.low);
    setTimeout(function(){env.classList.add('rise');},timing.rise);
    setTimeout(function(){env.classList.add('out');requestAnimationFrame(place);},timing.out);
    setTimeout(function(){
      done=true;env.classList.add('done');env.removeAttribute('role');env.removeAttribute('tabindex');
      card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label','Kartpostalı çevir');
      panel.classList.add('show');requestAnimationFrame(place);card.focus({preventScroll:true});
    },timing.done);
  }
  env.addEventListener('click',open);
  env.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
  addEventListener('resize',function(){if(done)place();});

  function apply(){flip.style.transform='rotateY('+rot+'deg)';}
  flip.addEventListener('pointerdown',function(e){
    if(!done) return; drag=true; moved=false; sx=e.clientX; base=rot;
    flip.classList.add('drag'); flip.setPointerCapture(e.pointerId);
  });
  flip.addEventListener('pointermove',function(e){
    if(!drag) return; var dx=e.clientX-sx;
    if(Math.abs(dx)>4) moved=true;
    rot=base+dx*0.45; apply();
  });
  function end(){
    if(!drag) return; drag=false; flip.classList.remove('drag');
    rot = moved ? Math.round(rot/180)*180 : base+180; apply();
  }
  flip.addEventListener('pointerup',end);
  flip.addEventListener('pointercancel',end);
  card.addEventListener('keydown',function(e){
    if(!done) return;
    if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){e.preventDefault();rot+=180;apply();}
    if(e.key==='ArrowLeft'){e.preventDefault();rot-=180;apply();}
  });
})();
</script>
</body>
</html>
